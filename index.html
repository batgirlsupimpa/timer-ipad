<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width,initial-scale=1">
<style>
html,body{
margin:0;width:100%;height:100%;
background:#000;color:#fff;
font-family:Arial,sans-serif;
overflow:hidden;
}
#t{
font-size:22vw;
text-align:center;
margin-top:18vh;
font-weight:normal;
}
#controls{
position:fixed;
bottom:18px;
left:0;
right:0;
text-align:center;
opacity:.65;
}
button{
background:transparent;
border:0;
color:#fff;
font-size:16px;
padding:8px 10px;
}
button:active{opacity:.5}
</style>
</head>

<body>

<div id="t">00:00</div>

<div id="controls">
<button onclick="start()">▶</button>
<button onclick="pause()">⏸</button>
<button onclick="resume()">▶</button>
<button onclick="restart()">↻</button>
<button onclick="fullscreen()">⛶</button>
</div>

<script>
let s=0;
let timer=null;

function show(){
let m=Math.floor(s/60);
let sec=s%60;
document.getElementById("t").innerHTML=
String(m).padStart(2,"0")+":"+String(sec).padStart(2,"0");
}

function start(){
if(timer===null){
s=0;
show();
timer=setInterval(()=>{
s++;
show();
},1000);
}
}

function pause(){
if(timer!==null){
clearInterval(timer);
timer=null;
}
}

function resume(){
if(timer===null){
timer=setInterval(()=>{
s++;
show();
},1000);
}
}

function restart(){
clearInterval(timer);
timer=null;
s=0;
show();
}

function fullscreen(){
if(document.documentElement.requestFullscreen){
document.documentElement.requestFullscreen();
}
}

show();
</script>

</body>
</html>
